<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome</title>
  <style>
    html, body, #welcome-root {
      height: 100%;
      margin: 0;
    }
    #welcome-root {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #1e1e1e;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      color: white;
      animation: fadeIn 1.2s ease-out;
    }
    .content h1 {
      font-size: 4em;
      font-weight: 300;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      letter-spacing: -0.02em;
    }
    .content p {
      font-size: 1.4em;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 32px;
      font-weight: 300;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    .user-info {
      margin-top: 28px;
    }
    .user-name {
      font-size: 2.4em;
      font-weight: 500;
      color: white;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 1.2em;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 10px;
      font-weight: 300;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    .inspirational-quote {
      font-size: 1.1em;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 28px;
      font-style: italic;
      font-weight: 300;
      line-height: 1.6;
      max-width: 720px;
      padding: 0 16px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="welcome-root">
    <main class="content">
      <h1>Welcome to Sejati.io</h1>
      <p>Secure. Fast. Ready to explore.</p>
      <div class="user-info">
        <div class="user-name" id="userName">User</div>
        <div class="subtitle" id="today">--/--/----</div>
        <div class="inspirational-quote" id="quote"></div>
      </div>
    </main>
  </div>

  <script>
    // Quotes array
    const QUOTES = [
      "Simplicity is the soul of efficiency. — Austin Freeman",
      "The only way to do great work is to love what you do. — Steve Jobs",
      "Focus is saying no. — Steve Jobs",
      "The best way to predict the future is to invent it. — Alan Kay",
      "First, solve the problem. Then, write the code. — John Johnson",
      "Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupéry",
      "Programs must be written for people to read, and only incidentally for machines to execute. — Harold Abelson"
    ];

    // Pick a random quote
    function getRandomQuote() {
      const idx = Math.floor(Math.random() * QUOTES.length);
      return QUOTES[idx];
    }

    // Initialize the page
    async function init() {
      try {
        const user = await window.sejati.getUserInfo();
        const userNameEl = document.getElementById('userName');
        const todayEl = document.getElementById('today');
        const quoteEl = document.getElementById('quote');

        if (userNameEl) userNameEl.textContent = user.username || 'User';
        if (todayEl) todayEl.textContent = user.today;
        if (quoteEl) quoteEl.textContent = getRandomQuote();
      } catch (error) {
        console.error('Failed to initialize welcome page:', error);
      }
    }

    // Run when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
