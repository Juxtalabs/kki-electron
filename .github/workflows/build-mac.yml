name: Build Mac Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install
          cd packages/shell && npm install
      
      - name: Build Mac installer with electron-forge
        run: cd packages/shell && npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            packages/shell/out/make/**/*.dmg
            packages/shell/out/make/**/*.zip
          retention-days: 30
