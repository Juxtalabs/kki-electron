directories:
  output: release
  buildResources: assets
  app: .
appId: io.kki.app
productName: KKI Browser
win:
  target:
    - nsis
  icon: assets/kki-icon.ico
  artifactName: KKI-Browser-${version}-win.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/kki-icon.icns
  category: public.app-category.education
  artifactName: KKI-Browser-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
  title: KKI Browser ${version}
  window:
    width: 540
    height: 380
files:
  - filter:
      - dist/**/*
      - assets/**/*
      - package.json
extraMetadata:
  main: dist/main/main.js
electronVersion: 32.3.3
