<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .popup-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-container {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .icon {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .message {
            color: #5a6c7d;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .domain-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b6b;
        }

        .domain-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .domain-name {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 600;
            word-break: break-all;
        }

        .button-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-close {
            background: #6c757d;
            color: white;
        }

        .btn-close:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .btn-close:active {
            transform: translateY(0);
        }

        .countdown {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #6c757d;
            font-weight: 600;
        }

        .warning-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24, #ff6b6b);
            background-size: 200% 100%;
            animation: warning 2s linear infinite;
        }

        @keyframes warning {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }
    </style>
</head>
<body>
    <div class="warning-strip"></div>
    <div class="countdown" id="countdown">5</div>
    
    <div class="popup-container">
        <div class="icon-container">
            <div class="icon">🚫</div>
        </div>
        
        <h1>Access Denied</h1>
        
        <p class="message">
            You are not authorized to access this domain. This website has been blocked for security reasons.
        </p>
        
        <div class="domain-info">
            <div class="domain-label">Blocked Domain</div>
            <div class="domain-name" id="blocked-domain">Loading...</div>
        </div>
        
        <div class="button-container">
            <button class="btn btn-close" id="close-btn">Close</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        
        let countdownInterval
        let countdownValue = 5

        // Handle access denied info from main process
        ipcRenderer.on('set-access-denied-info', (event, data) => {
            document.getElementById('blocked-domain').textContent = data.domain
            
            // Start countdown
            startCountdown()
        })

        function startCountdown() {
            countdownValue = 5
            updateCountdown()
            
            countdownInterval = setInterval(() => {
                countdownValue--
                updateCountdown()
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval)
                }
            }, 1000)
        }

        function updateCountdown() {
            const countdownEl = document.getElementById('countdown')
            countdownEl.textContent = countdownValue
            
            // Add warning effect when time is running out
            if (countdownValue <= 2) {
                countdownEl.style.background = '#ff6b6b'
                countdownEl.style.color = 'white'
            }
        }

        // Close button handler
        document.getElementById('close-btn').addEventListener('click', async () => {
            await ipcRenderer.invoke('close-access-denied-popup')
        })

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval)
            }
        })
    </script>
</body>
</html>
