<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Verify Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
    }

    #face-api-panel {
      position: fixed;
      top: 80px;
      right: 20px;
      width: 400px;
      max-height: calc(100vh - 100px);
      background: rgba(30, 30, 30, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: white;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 9999;
    }

    #face-api-panel.active {
      display: flex;
    }

    .panel-header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-panel {
      background: rgba(255, 59, 48, 0.8);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-panel:hover {
      background: rgba(255, 59, 48, 1);
    }

    .panel-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(0, 122, 255, 0.8);
      background: rgba(255, 255, 255, 0.15);
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: black;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: rgba(0, 122, 255, 0.8);
      color: white;
    }

    .btn-primary:hover {
      background: rgba(0, 122, 255, 1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .status-message.active {
      display: block;
    }

    .status-message.success {
      background: rgba(52, 199, 89, 0.2);
      border: 1px solid rgba(52, 199, 89, 0.5);
      color: #34C759;
    }

    .status-message.error {
      background: rgba(255, 59, 48, 0.2);
      border: 1px solid rgba(255, 59, 48, 0.5);
      color: #FF3B30;
    }

    .status-message.info {
      background: rgba(0, 122, 255, 0.2);
      border: 1px solid rgba(0, 122, 255, 0.5);
      color: #007AFF;
    }

    .result-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
    }

    .result-box .result-label {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .result-box .result-value {
      font-weight: 500;
      font-size: 14px;
    }

    .result-box .result-value.verified {
      color: #34C759;
    }

    .result-box .result-value.failed {
      color: #FF3B30;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="face-api-panel">
    <div class="panel-header">
      <h2>🔍 Face Identify</h2>
      <button class="close-panel" id="close-panel">×</button>
    </div>

    <div class="panel-content">
      <div class="status-message" id="identify-status"></div>

      <div class="video-container">
        <video id="identify-video" autoplay playsinline></video>
        <div class="video-overlay" id="identify-video-overlay">Starting camera...</div>
      </div>

      <div id="identify-countdown" style="font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 12px;"></div>

      <div class="result-box" id="identify-result" style="display: none;">
        <div class="result-label">Identified User:</div>
        <div class="result-value" id="identify-user-name"></div>
        <div style="margin-top: 8px;">
          <div class="result-label">User ID:</div>
          <div class="result-value" id="identify-user-id"></div>
        </div>
        <div style="margin-top: 8px;">
          <div class="result-label">Confidence Level:</div>
          <div class="result-value" id="identify-confidence"></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="capture-canvas"></canvas>

  <script src="face-api-panel-ui.js"></script>
</body>
</html>
